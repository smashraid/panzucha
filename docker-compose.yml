services:
  postgres:
    image: postgres:latest
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - /home/smashraid/volumes/postgresql:/var/lib/postgresql
    networks:
      - dev

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: smashraid@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
      - "5000:443"
    volumes:
      - /home/smashraid/volumes/pgadmin:/var/lib/pgadmin
    networks:
      - dev

  rabbitmq:
    image: rabbitmq:4.1.3-management
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
      #RABBITMQ_VM_MEMORY_HIGH_WATERMARK: "512MiB"
    ports:
      - "5672:5672"      # AMQP protocol (Go client)
      - "15672:15672"    # Management UI
    volumes:      
      - /home/smashraid/volumes/rabbitmq:/var/lib/rabbitmq
      #- /home/smashraid/volumes/rabbitmq/conf/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks:
      - dev

networks:
  dev:
    name: local
  # bridge:
  #   external: true
  #   name: bridge