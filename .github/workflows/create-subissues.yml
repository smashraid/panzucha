name: Create Sub-Issues from Epic Table

on:
  issues:
    types: [labeled]

jobs:
  create-subissues:
    if: github.event.label.name == 'auto-create-subissues'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Parse table and create issues
        uses: actions/github-script@v7
        with:
          script: |
            const epicIssue = context.payload.issue;
            const body = epicIssue.body;
            console.log("Issue body length:", body.length);
            console.log("First 500 characters:\n", body.substring(0, 500));
            
            // More flexible regex: allows variable spaces, captures ticket, description, deliverables
            const rowRegex = /\|\s*([\d\.]+)\s*\|\s*(.*?)\s*\|\s*(.*?)\s*\|/g;
            let rows = [];
            let match;
            while ((match = rowRegex.exec(body)) !== null) {
              rows.push(match);
            }
            console.log(`Found ${rows.length} rows.`);
            
            if (rows.length === 0) {
              console.log("No rows found. Check table formatting. Expected a markdown table with three columns separated by pipes.");
              return;
            }
            
            const query = `
                  mutation($repositoryId: ID!, $title: String!, $body: String!, $labels: [String!], $assigneeIds: [ID!], $parentIssueId: ID!) {
                    createIssue(input: {
                      repositoryId: $repositoryId,
                      title: $title,
                      body: $body,
                      labelIds: $labels,
                      assigneeIds: $assigneeIds,
                      parentIssueId: $parentIssueId
                    }) {
                      issue {
                        id
                        number
                      }
                    }
                  }
                `;
                
            for (const row of rows) {
              // ... get ticket, description, deliverables
              const result = await github.graphql(query, {
                repositoryId: context.repo.owner + "/" + context.repo.repo,
                title: `${ticket} – ${description.trim()}`,
                body: `**Deliverables:**\n${deliverables.trim()}\n\nPart of epic #${epicIssue.number}`,
                labels: ['type:task'],
                assigneeIds: [context.actor],
                parentIssueId: epicIssue.node_id
              });
              console.log(`Created issue #${result.createIssue.issue.number}`);
            }