name: Create Sub-Issues from Epic Table

on:
  issues:
    types: [labeled]

jobs:
  create-subissues:
    if: github.event.label.name == 'auto-create-subissues'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Parse table and create detailed sub-issues
        uses: actions/github-script@v7
        with:
          script: |
            const epicIssue = context.payload.issue;
            const body = epicIssue.body;
            const repositoryId = context.payload.repository.node_id;
            const parentIssueId = epicIssue.node_id;

            const rowRegex = /\|\s*\*{0,2}([\w.]+)\*{0,2}\s*\|\s*(.*?)\s*\|\s*(.*?)\s*\|\s*(.*?)\s*\|/g;

            let rows = [];
            let match;
            while ((match = rowRegex.exec(body)) !== null) {
              const taskId = match[1].trim();
              if (taskId === 'Task' || /^:?-+:?$/.test(taskId)) {
                continue;
              }
              rows.push(match);
            }
            console.log(`Found ${rows.length} valid task rows.`);

            const existingTitlesQuery = [
              'query($id: ID!) {',
              '  node(id: $id) {',
              '    ... on Issue {',
              '      subIssues(first: 100) {',
              '        nodes { title }',
              '      }',
              '    }',
              '  }',
              '}'
            ].join('\n');

            let existingTitles = new Set();
            try {
              const existing = await github.graphql(existingTitlesQuery, { id: parentIssueId });
              existingTitles = new Set(existing.node.subIssues.nodes.map(n => n.title));
            } catch (err) {
              console.error('Failed to fetch existing sub-issues, proceeding without dedup:', err);
            }

            const mutation = [
              'mutation($repositoryId: ID!, $title: String!, $body: String!, $parentIssueId: ID!) {',
              '  createIssue(input: {',
              '    repositoryId: $repositoryId,',
              '    title: $title,',
              '    body: $body,',
              '    parentIssueId: $parentIssueId',
              '  }) {',
              '    issue {',
              '      number',
              '      url',
              '    }',
              '  }',
              '}'
            ].join('\n');

            for (const row of rows) {
              const taskId = row[1].trim();
              const description = row[2].trim();
              const affectedAreas = row[3].trim();
              const deliverables = row[4].trim().replace(/<br\s*\/?>/gi, '\n');

              const issueTitle = `[${taskId}] ${description}`;

              if (existingTitles.has(issueTitle)) {
                console.log(`Skipping ${taskId} - sub-issue already exists.`);
                continue;
              }

              // Built with .join('\n') instead of a raw multi-line template
              // literal. Every line of THIS script stays at the same YAML
              // indentation level no matter what the generated string looks
              // like at runtime - avoids the block-scalar dedent trap.
              const issueBody = [
                '## Task Overview',
                description,
                '',
                '### Deliverables & Acceptance Criteria',
                deliverables,
                '',
                '### Affected Codebase Areas',
                '```',
                affectedAreas,
                '```',
                '',
                '### Execution Instructions for Developer / OpenCode',
                '1. Fetch ticket requirements and inspect affected packages.',
                '2. Implement changes following standard Go idioms and project architecture rules.',
                '3. Run local validations: `go fmt ./...`, `golangci-lint run`, and `go test -v ./...`.',
                '4. Perform DB migration checks if SQL schemas were modified.',
                '',
                '---',
                `Part of Epic #${epicIssue.number}`
              ].join('\n');

              const variables = {
                repositoryId,
                title: issueTitle,
                body: issueBody,
                parentIssueId
              };

              try {
                const result = await github.graphql({
                  query: mutation,
                  headers: { 'GraphQL-Features': 'sub_issues' },
                  ...variables
                });
                console.log(`Created sub-issue #${result.createIssue.issue.number}: ${issueTitle}`);
              } catch (err) {
                console.error(`Failed to create issue for ${taskId}:`, err);
              }
            }