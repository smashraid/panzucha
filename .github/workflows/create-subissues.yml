name: Create Sub-Issues from Epic Table

on:
  issues:
    types: [labeled]

jobs:
  create-subissues:
    if: github.event.label.name == 'auto-create-subissues'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Parse table and create issues
        uses: actions/github-script@v7
        with:
          script: |
            const epicIssue = context.payload.issue;
            const body = epicIssue.body;
            // Extract table rows (simple regex, assumes markdown table)
            const rows = body.match(/\| ([\d\.]+) \| (.*?) \| (.*?) \|/g);
            if (!rows) return;
            for (const row of rows) {
              const [, ticket, description, deliverables] = row.match(/\| ([\d\.]+) \| (.*?) \| (.*?) \|/);
              // Create sub-issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `${ticket} – ${description.trim()}`,
                body: `**Deliverables:**\n${deliverables.trim()}\n\nPart of epic #${epicIssue.number}`,
                labels: ['type:task'],
                assignees: [context.actor]
              });
            }